<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="arch.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Arch Build</title>
    <!-- set theme before first paint so dark mode doesn't flash light -->
    <script>
      try {
        // %VITE_ENABLE_EXTRA_THEMES% is filled in by Vite from front/.env
        var themes = ['light', 'dark']
        if ('%VITE_ENABLE_EXTRA_THEMES%' !== 'false') themes.push('linen', 'fjord', 'matte', 'charcoal', 'paper')
        var saved = localStorage.getItem('theme')
        document.documentElement.dataset.theme =
          themes.indexOf(saved) !== -1
            ? saved
            : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
